name: Draft FSL Release with Build Artifacts

on:
  push:
    tags:
      - 'v*' # Triggers on version tags, e.g., v1.0.0
  workflow_dispatch: # Builds and checks the packages on a branch. Creates no tag or release

permissions:
  contents: write

env:
  # Pinned versions for the Linux packages. Bump them by hand, and update the checksum with the new release's checksums.txt
  NFPM_VERSION: '2.48.0'
  NFPM_SHA256: '6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750'
  FEDORA_VERSION: '45' # the .rpm check runs in a fedora:<FEDORA_VERSION> container

jobs:
  build:
    # 22.04 has glibc 2.35, so the desktop app runs on Ubuntu 22.04+ and Debian 12+
    runs-on: ubuntu-22.04
    outputs:
      packages: ${{ steps.pins.outputs.packages }}
      fedora: ${{ steps.pins.outputs.fedora }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, so the previous release can be found

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install desktop app build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev gcc-mingw-w64-x86-64

      - name: Decide What to Build
        id: pins
        env:
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          echo "fedora=$FEDORA_VERSION" >> "$GITHUB_OUTPUT"
          # Tags with a hyphen, such as v0.0.1-test, build the zip only. Manual runs build the packages
          if [ "$REF_TYPE" = "tag" ] && [[ "$REF" == *-* ]]; then
            echo "packages=false" >> "$GITHUB_OUTPUT"
          else
            echo "packages=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Makefile Build
        run: |
          make build

      - name: Collect the Release Files
        env:
          LABEL: ${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
        run: |
          # dist/gamedist.zip already holds the binaries and README.md, so publish it as is, with the tag in its name
          mkdir -p release
          cp dist/gamedist.zip "release/gamedist-$LABEL.zip"

      - name: Install nfpm
        if: steps.pins.outputs.packages == 'true'
        run: |
          curl -sSfL -o /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
          sudo tar -C /usr/local/bin -xzf /tmp/nfpm.tar.gz nfpm

      - name: Build the Linux Packages
        if: steps.pins.outputs.packages == 'true'
        run: |
          make package-linux
          cp dist/gamedist_*.deb dist/gamedist-*.rpm dist/gamedist-*-linux-amd64.tar.gz release/

      - name: Upload the Release Files
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: release/*
          if-no-files-found: error

      - name: Upload the Install Check
        if: steps.pins.outputs.packages == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: install-check
          path: packaging/scripts/check-install.sh
          if-no-files-found: error

  check-deb-ubuntu:
    needs: build
    if: needs.build.outputs.packages == 'true'
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    steps:
      - name: Download the Packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: release
      - name: Download the Install Check
        uses: actions/download-artifact@v4
        with:
          name: install-check
          path: check
      - name: Install the .deb and Check It
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y desktop-file-utils ./release/gamedist_*.deb
          sh check/check-install.sh

  check-deb-debian:
    needs: build
    if: needs.build.outputs.packages == 'true'
    runs-on: ubuntu-22.04
    container: debian:12
    steps:
      - name: Download the Packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: release
      - name: Download the Install Check
        uses: actions/download-artifact@v4
        with:
          name: install-check
          path: check
      - name: Install the .deb and Check It
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y desktop-file-utils ./release/gamedist_*.deb
          sh check/check-install.sh

  check-rpm-fedora:
    needs: build
    if: needs.build.outputs.packages == 'true'
    runs-on: ubuntu-22.04
    container: fedora:${{ needs.build.outputs.fedora }}
    steps:
      - name: Download the Packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: release
      - name: Download the Install Check
        uses: actions/download-artifact@v4
        with:
          name: install-check
          path: check
      - name: Install the .rpm and Check It
        run: |
          dnf install -y desktop-file-utils
          dnf install -y --nogpgcheck ./release/gamedist-*.rpm
          sh check/check-install.sh

  draft-release:
    needs: [build, check-deb-ubuntu, check-deb-debian, check-rpm-fedora]
    # Runs for tags only. Skipped checks are fine for a tag with a hyphen, which builds the zip only
    if: >-
      always() && github.ref_type == 'tag' && needs.build.result == 'success' &&
      (needs.build.outputs.packages == 'false' ||
       (needs.check-deb-ubuntu.result == 'success' && needs.check-deb-debian.result == 'success' && needs.check-rpm-fedora.result == 'success'))
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, so the previous release can be found

      - name: Calculate FSL Licensing Dates
        id: dates
        run: |
          RELEASE_DATE=$(date +"%B %d, %Y")
          TRANSITION_DATE=$(date -d "+2 years" +"%B %d, %Y")
          echo "release_date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"
          echo "transition_date=$TRANSITION_DATE" >> "$GITHUB_OUTPUT"

      - name: Download the Release Files
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: release

      - name: Write Release Notes
        env:
          REF: ${{ github.ref_name }}
          RELEASE_DATE: ${{ steps.dates.outputs.release_date }}
          TRANSITION_DATE: ${{ steps.dates.outputs.transition_date }}
        run: |
          # Commits since the previous release tag. Merge commits are left out, because the PR list covers them
          PREV=$(git describe --tags --abbrev=0 --match 'v*' --exclude "$REF" HEAD 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
            HEADING="## Commits since $PREV"
          else
            RANGE="HEAD"
            HEADING="## Commits"
          fi
          {
            echo ""
            echo "---"
            echo "### 📄 License Notice for this Release"
            echo "* **Release Date:** $RELEASE_DATE"
            echo "* **Current License:** Functional Source License 1.1 (FSL-1.1) — *Non-compete clause applies.*"
            echo "* **Open Source Transition Date:** $TRANSITION_DATE — *On this date, this specific tag (\`$REF\`) automatically converts to the Apache License 2.0.*"
            echo ""
            echo "$HEADING"
            echo ""
            git log --no-merges --pretty='* %s' "$RANGE"
          } > release-notes.md

      - name: Create Draft Release with Automated Changelog & FSL Notice
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true # Instructs GitHub to dynamically generate the "What's Changed" log
          files: release/*
          body_path: release-notes.md
