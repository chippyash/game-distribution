name: Draft FSL Release with Build Artifacts

on:
  push:
    tags:
      - 'v*' # Triggers on version tags, e.g., v1.0.0

permissions:
  contents: write

jobs:
  draft-release:
    # 22.04 has glibc 2.35, so the desktop app runs on Ubuntu 22.04+ and Debian 12+
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install desktop app build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev gcc-mingw-w64-x86-64

      - name: Calculate FSL Licensing Dates
        id: dates
        run: |
          RELEASE_DATE=$(date +"%B %d, %Y")
          TRANSITION_DATE=$(date -d "+2 years" +"%B %d, %Y")
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT
          echo "transition_date=$TRANSITION_DATE" >> $GITHUB_OUTPUT

      - name: Run Makefile Build
        run: |
          make build

      - name: Name the Release Archive
        id: package
        run: |
          # dist/gamedist.zip already holds the binaries and README.md, so publish it as is, with the tag in its name
          ARCHIVE_NAME="gamedist-${{ github.ref_name }}.zip"
          cp dist/gamedist.zip "$ARCHIVE_NAME"
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT

      - name: Create Draft Release with Automated Changelog & FSL Notice
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true # Instructs GitHub to dynamically generate the "What's Changed" log
          files: ${{ steps.package.outputs.archive_name }}
          body: |
            
            ---
            ### 📄 License Notice for this Release
            * **Release Date:** ${{ steps.dates.outputs.release_date }}
            * **Current License:** Functional Source License 1.1 (FSL-1.1) — *Non-compete clause applies.*
            * **Open Source Transition Date:** ${{ steps.dates.outputs.transition_date }} — *On this date, this specific tag (`${{ github.ref_name }}`) automatically converts to the Apache License 2.0.*
